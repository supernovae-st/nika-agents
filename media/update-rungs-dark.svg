<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-label="Updating: brew upgrade nika for the binary · then the two rungs for the Claude Code plugin: marketplace update, plugin update, restart">
  <!-- The update rungs · same THEME contract as hero-dark.svg (the light
       twin swaps only the THEME block · scripts/media/derive-hero-light.py). -->
  <style>
    /* THEME:START */
    :root {
      --bg0: #050a1c; --bg1: #0a1226;
      --ink: #f4f5f7; --tag: #9fb3cf; --cmd: #d7e5f4;
      --legend: #8fa3bf; --legend-dim: #5a6d8a;
      --accent: #ff7a3c;
      --mark: #9fd0ff; --glow: #5b8cff;
      --star: #f4f5f7; --star-op: 1; --tw-lo: 0.15; --tw-hi: 0.9;
      --pulse-lo: 0.3; --pulse-hi: 0.65; --halo-op: 0.3;
      --chip-bg: #0d1730; --chip-stroke: #1d2b4d;
      --frame: #f4f5f7; --frame-op: 0.08;
      --v-infer: #5b8cff; --v-exec: #ff7a3c; --v-invoke: #22d3ee; --v-agent: #b07bff;
      --wm-op: 0.06;
    }
    /* THEME:END */
    .mono { font-family: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .cmd { font-size: 14px; fill: var(--cmd); }
    .lbl { font-size: 11px; fill: var(--legend); letter-spacing: 0.02em; }
    .dim { font-size: 11px; fill: var(--legend-dim); }
    .law { font-size: 11px; fill: var(--legend-dim); }
    .arrow { font-size: 16px; fill: var(--legend); }
    .s1 { animation: twinkle 3.4s ease-in-out infinite alternate; }
    .s2 { animation: twinkle 4.8s ease-in-out 1.1s infinite alternate; }
    .stars { opacity: var(--star-op); }
    .h1 { animation: hi1 9s ease-in-out infinite; }
    .h2 { animation: hi2 9s ease-in-out infinite; }
    .h3 { animation: hi3 9s ease-in-out infinite; }
    @keyframes twinkle { from { opacity: var(--tw-lo); } to { opacity: var(--tw-hi); } }
    @keyframes hi1 { 0% { opacity: 0; } 6% { opacity: 1; } 27% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes hi2 { 0%, 33% { opacity: 0; } 39% { opacity: 1; } 60% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes hi3 { 0%, 66% { opacity: 0; } 72% { opacity: 1; } 93% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg0)"/>
      <stop offset="1" stop-color="var(--bg1)"/>
    </linearGradient>
    <clipPath id="uframe"><rect width="1200" height="150" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#uframe)">
    <rect width="1200" height="150" fill="url(#ubg)"/>
    <g class="stars" fill="var(--star)">
      <circle class="s1" cx="150" cy="24" r="1.1"/><circle class="s2" cx="420" cy="132" r="1"/>
      <circle class="s1" cx="640" cy="20" r="1.3"/><circle class="s2" cx="884" cy="130" r="1"/>
      <circle class="s1" cx="1060" cy="26" r="1.1"/><circle class="s2" cx="1160" cy="112" r="1"/>
      <circle class="s2" cx="70" cy="120" r="1"/><circle class="s1" cx="990" cy="118" r="1.2"/>
    </g>

    <text class="mono lbl" x="40" y="44">the binary</text>
    <rect x="40" y="60" width="208" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h1" x="40" y="60" width="208" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="60" y="86">brew upgrade nika</text>

    <text class="mono arrow" x="258" y="86">→</text>

    <text class="mono lbl" x="284" y="44">rung 1 · the marketplace clone</text>
    <rect x="284" y="60" width="406" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h2" x="284" y="60" width="406" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="304" y="86">claude plugin marketplace update nika</text>

    <text class="mono arrow" x="700" y="86">→</text>

    <text class="mono lbl" x="726" y="44">rung 2 · the plugin</text>
    <rect x="726" y="60" width="337" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h3" x="726" y="60" width="337" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="746" y="86">claude plugin update nika@nika</text>

    <text class="mono dim" x="1079" y="86">· restart</text>

    <text class="mono law" x="600" y="132" text-anchor="middle">no surface updates another · brew never touches a plugin · a marketplace never touches the binary</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="12" fill="none" stroke="var(--frame)" stroke-opacity="var(--frame-op)"/>
</svg>
