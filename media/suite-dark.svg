<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" role="img" aria-label="One Add installs the whole suite: 4 skills, 3 subagents, 6 commands, 3 hooks and the read-only oracle">
  <!-- The suite strip · same THEME contract as hero-dark.svg (the light twin
       swaps only the THEME block · scripts/media/derive-hero-light.py). The
       counts are gate-checked against the bundle (scripts/check-clients-
       matrix.py COUNT_SCAN) — heal the bundle or this file, never one alone. -->
  <style>
    /* THEME:START */
    :root {
      --bg0: #050a1c; --bg1: #0a1226;
      --ink: #f4f5f7; --tag: #9fb3cf; --cmd: #d7e5f4;
      --legend: #8fa3bf; --legend-dim: #5a6d8a;
      --accent: #ff7a3c;
      --mark: #9fd0ff; --glow: #5b8cff;
      --star: #f4f5f7; --star-op: 1; --tw-lo: 0.15; --tw-hi: 0.9;
      --pulse-lo: 0.3; --pulse-hi: 0.65; --halo-op: 0.3;
      --chip-bg: #0d1730; --chip-stroke: #1d2b4d;
      --frame: #f4f5f7; --frame-op: 0.08;
      --v-infer: #5b8cff; --v-exec: #ff7a3c; --v-invoke: #22d3ee; --v-agent: #b07bff;
      --wm-op: 0.06;
    }
    /* THEME:END */
    .mono { font-family: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .cmd { font-size: 13px; fill: var(--cmd); }
    .dim { font-size: 10px; fill: var(--legend-dim); }
    .lead { font-size: 11px; fill: var(--legend); letter-spacing: 0.02em; }
    .stars { opacity: var(--star-op); }
    .s1 { animation: twinkle 3.4s ease-in-out infinite alternate; }
    .s2 { animation: twinkle 4.8s ease-in-out 1.1s infinite alternate; }
    .h1 { animation: hi1 12s ease-in-out infinite; }
    .h2 { animation: hi2 12s ease-in-out infinite; }
    .h3 { animation: hi3 12s ease-in-out infinite; }
    .h4 { animation: hi4 12s ease-in-out infinite; }
    .h5 { animation: hi5 12s ease-in-out infinite; }
    @keyframes twinkle { from { opacity: var(--tw-lo); } to { opacity: var(--tw-hi); } }
    @keyframes hi1 { 0% { opacity: 0; } 4% { opacity: 1; } 16% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes hi2 { 0%, 20% { opacity: 0; } 24% { opacity: 1; } 36% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes hi3 { 0%, 40% { opacity: 0; } 44% { opacity: 1; } 56% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes hi4 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 76% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes hi5 { 0%, 80% { opacity: 0; } 84% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg0)"/>
      <stop offset="1" stop-color="var(--bg1)"/>
    </linearGradient>
    <clipPath id="sframe"><rect width="1200" height="130" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#sframe)">
    <rect width="1200" height="130" fill="url(#sbg)"/>
    <g class="stars" fill="var(--star)">
      <circle class="s1" cx="90" cy="30" r="1.1"/><circle class="s2" cx="150" cy="100" r="1"/>
      <circle class="s1" cx="1060" cy="26" r="1.2"/><circle class="s2" cx="1130" cy="90" r="1"/>
      <circle class="s1" cx="1170" cy="46" r="1"/><circle class="s2" cx="52" cy="70" r="1"/>
    </g>

    <text class="mono lead" x="600" y="28" text-anchor="middle">one Add installs the whole suite</text>

    <rect x="206" y="44" width="110" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h1" x="206" y="44" width="110" height="40" rx="8" fill="none" stroke="var(--v-infer)" opacity="0"/>
    <text class="mono cmd" x="224" y="70">4 skills</text>
    <text class="mono dim" x="261" y="108" text-anchor="middle">author→migrate</text>

    <rect x="338" y="44" width="138" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h2" x="338" y="44" width="138" height="40" rx="8" fill="none" stroke="var(--v-exec)" opacity="0"/>
    <text class="mono cmd" x="356" y="70">3 subagents</text>
    <text class="mono dim" x="407" y="108" text-anchor="middle">write · debug · port</text>

    <rect x="498" y="44" width="129" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h3" x="498" y="44" width="129" height="40" rx="8" fill="none" stroke="var(--v-invoke)" opacity="0"/>
    <text class="mono cmd" x="516" y="70">6 commands</text>
    <text class="mono dim" x="562" y="108" text-anchor="middle">/nika:*</text>

    <rect x="649" y="44" width="101" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h4" x="649" y="44" width="101" height="40" rx="8" fill="none" stroke="var(--v-agent)" opacity="0"/>
    <text class="mono cmd" x="667" y="70">3 hooks</text>
    <text class="mono dim" x="699" y="108" text-anchor="middle">the seatbelts</text>

    <rect x="772" y="44" width="222" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h5" x="772" y="44" width="222" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="790" y="70">the read-only oracle</text>
    <text class="mono dim" x="883" y="108" text-anchor="middle">nika_check → nika_tools</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="129" rx="12" fill="none" stroke="var(--frame)" stroke-opacity="var(--frame-op)"/>
</svg>
